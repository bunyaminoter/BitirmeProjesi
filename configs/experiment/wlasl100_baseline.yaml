# =============================================================================
# WLASL 100 Baseline Experiment Configuration
# =============================================================================
# Full experiment config for WLASL-100 word-level sign recognition.
# Run: python scripts/train.py --config configs/experiment/wlasl100_baseline.yaml

name: "wlasl100_baseline"
seed: 42
device: "cpu"
output_dir: "outputs/wlasl100_baseline/"

# --- Dataset ---
dataset:
  name: "wlasl"
  annotation_file: "nslt_100.json"
  video_dir: "videos/"
  num_classes: 100
  num_frames: 16
  class_list_file: "wlasl_class_list.txt"
  train_split: "train"
  val_split: "val"
  test_split: "test"

# --- Model Architecture ---
model:
  num_classes: 100
  classifier_dropout: 0.5

  hand_encoder:
    backbone: "resnet18"
    pretrained: true
    output_dim: 256
    input_size: [224, 224]
    shared_weights: true
    dropout: 0.3

  landmark_encoder:
    input_dim: 99          # 33 pose landmarks * 3 (x, y, z)
    hidden_dims: [256, 128]
    output_dim: 256
    dropout: 0.3
    use_batch_norm: true
    include_face: false
    num_pose_landmarks: 33

  fusion:
    method: "concat"
    output_dim: 512
    dropout: 0.3
    num_heads: 4

  temporal:
    method: "transformer"
    hidden_dim: 256
    num_layers: 2
    dropout: 0.3
    num_heads: 4
    max_seq_len: 64

# --- Training ---
training:
  epochs: 100
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  mixed_precision: true
  gradient_clip: 1.0
  num_workers: 4
  pin_memory: true
  early_stopping_patience: 15
  checkpoint_dir: "outputs/wlasl100_baseline/checkpoints/"
  log_every_n_steps: 10
  val_every_n_epochs: 1

# --- Augmentation ---
augmentation:
  enabled: true
  random_crop: true
  random_horizontal_flip: true
  random_rotation: 15.0
  random_brightness: 0.2
  random_noise_std: 0.01
  frame_drop_prob: 0.1
  random_speed_range: [0.8, 1.2]
  hand_random_blur: true
  hand_random_translation: 10

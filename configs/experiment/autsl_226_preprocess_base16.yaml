# Preprocessing input only. This file does not select the 226-class model.
# Official train/val, 16 uniform frames, full 0..225 source labels.
name: autsl_226_preprocess_base16
seed: 7
device: auto
output_dir: outputs/autsl_226_preprocess_base16/
dataset:
  name: autsl
  annotation_file: data/autsl
  data_dir: data/autsl

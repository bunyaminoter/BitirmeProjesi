  num_classes: 226
  class_ids: null
  num_frames: 16
  cache_dir: cache/autsl_226_features_base16
  class_list_file: data/autsl/autsl_class_list_226.txt
  train_split: train
  val_split: val
  test_split: test
model:
  num_classes: 226
  hand_encoder:
    input_size: [160, 160]

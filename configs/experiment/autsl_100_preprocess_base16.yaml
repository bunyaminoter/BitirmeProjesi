  class_list_file: data/autsl/autsl_class_list_100.txt
  train_split: train
  val_split: val
  test_split: test
model:
  use_rgb: true
  num_classes: 100
  classifier_dropout: 0.4
  hand_encoder:
    backbone: mobilenet_v3_small
    pretrained: true
    freeze_backbone: true
    output_dim: 256
    input_size:
    - 160
    - 160
    shared_weights: true
    dropout: 0.3
    use_cbam: false
  landmark_encoder:
    encoder_type: landmark_mlp
    input_dim: 225
    hidden_dims:
    - 256
    - 128
    output_dim: 256
    dropout: 0.3
    use_batch_norm: true
    include_face: false
    num_pose_landmarks: 75
  fusion:
    method: cross_attention
    output_dim: 256
    dropout: 0.2
    num_heads: 4
  temporal:
    method: tcn_transformer
    hidden_dim: 256
    num_layers: 2
    dropout: 0.3
    num_heads: 4
    max_seq_len: 32
training:
  epochs: 60
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.01
  optimizer: adamw
  scheduler: cosine
  mixed_precision: true
  gradient_clip: 1.0
  num_workers: 2
  pin_memory: true
  early_stopping_patience: 15
  checkpoint_dir: outputs/autsl_100_preprocess_base16/checkpoints/
  log_every_n_steps: 10
  val_every_n_epochs: 1
  warmup_epochs: 3
  label_smoothing: 0.05
augmentation:
  enabled: true
  random_crop: false
  random_horizontal_flip: false
  random_rotation: 0.0
  random_brightness: 0.15
  pose_jitter_std: 0.01
  frame_drop_prob: 0.0
  random_speed_range:
  - 0.85
  - 1.15
  hand_random_translation: 0
